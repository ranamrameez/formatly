name: Web app

on:
  push:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
